<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="alphaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="50%" stop-color="#3a7bd5"/>
      <stop offset="100%" stop-color="#6a11cb"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Glow Hexagon / Rounded Shield -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="#161b22" stroke="url(#alphaGrad)" stroke-width="4" filter="url(#glow)"/>
  
  <!-- Greek Alpha / Stylized Terminal Orbit -->
  <path d="M 36 84 C 24 72, 24 48, 48 38 C 72 28, 86 48, 88 64 C 90 76, 100 88, 106 90" 
        fill="none" stroke="url(#alphaGrad)" stroke-width="8" stroke-linecap="round"/>
        
  <path d="M 94 38 C 84 52, 60 84, 46 86 C 34 88, 28 80, 34 68 C 42 52, 68 46, 88 56" 
        fill="none" stroke="#00d2ff" stroke-width="7" stroke-linecap="round"/>

  <!-- Core Pulse Point -->
  <circle cx="64" cy="64" r="7" fill="#ffffff" filter="url(#glow)"/>
</svg>
